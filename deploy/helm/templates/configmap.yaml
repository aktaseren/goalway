apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goalway.fullname" . }}-config
  labels:
    {{- include "goalway.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "goalway.fullname" .) | quote }}
{{- end }}
{{- if .Values.configFiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goalway.fullname" . }}-files
  labels:
    {{- include "goalway.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.configFiles }}
  {{ $key }}: |
{{- $value | nindent 4 }}
{{- end }}
{{- end }}
