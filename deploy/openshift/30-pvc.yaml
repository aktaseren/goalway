# Persistent storage for the RAG vector DB (vectors.db) and the
# feedback store (feedback.db). Both live under /app/data in the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goalway-data
  labels:
    app: goalway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
