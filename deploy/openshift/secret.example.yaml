# EXAMPLE SECRET -- do not use these values in a real deployment.
#
# Copy to secret.yaml (or `oc create secret`) and replace the
# placeholders. deploy/deploy.sh applies this example automatically the
# first time (so the gateway starts), then prints a reminder to swap in
# real credentials.
#
# Everything here is optional: with AUTH_PROVIDERS=api_key only, the
# OIDC_* values are simply unused.
apiVersion: v1
kind: Secret
metadata:
  name: goalway-secret
  labels:
    app: goalway
type: Opaque
stringData:
  # --- OIDC / Keycloak (see deploy/keycloak/README.md) ---
  OIDC_ISSUER: "https://keycloak-goalway.apps.example.com/realms/gateway"
  OIDC_AUDIENCE: "goalway"
  OIDC_ADMIN_ROLES: "admin,administrator,gateway-admin"
  # --- enterprise tools (gateway/tools/) ---
  GITHUB_TOKEN: "ghp-replace-me"
  ARGOCD_URL: "https://argocd.example.com"
  ARGOCD_TOKEN: "replace-me"
  # --- observability ---
  # Only set OTEL_EXPORTER_OTLP_ENDPOINT when you actually run an
  # OTel collector — a dangling endpoint makes the SDK retry-export
  # spans forever (noisy logs). Deploy one from observability/ first.
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"
