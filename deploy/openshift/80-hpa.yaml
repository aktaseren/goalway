# Autoscaling: 1..5 replicas at 70% average CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goalway
  labels:
    app: goalway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goalway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
